<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Access</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background-color: #1e1e1e;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
        }

        h1 {
            color: #00c853;
            margin-bottom: 30px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: #00c853;
            color: white;
            border: none;
            padding: 12px 30px;
            margin-top: 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #009624;
        }

        .error {
            color: #ff5252;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Admin Access</h1>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <br>

            <button type="submit">
                Access Dashboard
            </button>

        </form>

    </div>

</body>

</html>
